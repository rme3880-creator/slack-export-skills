<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flip Coin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Flip Coin</h1>

    <div class="scene">
      <div class="coin" id="coin">
        <div class="face heads">H</div>
        <div class="face tails">T</div>
        <div class="edge"></div>
      </div>
    </div>

    <p class="result" id="result">Tap the button to flip</p>

    <button id="flipBtn">Flip Coin</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
