<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jason Kim&#x27;s Birthday Party</title>
<style>

:root {
  color-scheme: light;
}
body {
  margin: 0;
  background: #eef0f3;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
.calendar-card-page {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 20px;
  box-sizing: border-box;
}
.calendar-card {
  width: 100%;
  border-radius: 28px;
  box-shadow: 0 10px 34px rgba(20, 20, 30, 0.16);
  overflow: visible;
  background: #fff;
}
.calendar-card__banner {
  border-radius: 28px 28px 0 0;
  padding: 30px 28px 26px;
  text-align: center;
  color: #fff;
  box-sizing: border-box;
}
.calendar-card__banner .weekday,
.calendar-card__banner .date {
  font-size: 34px;
  font-weight: 500;
  line-height: 1.18;
  margin: 0;
}
.calendar-card__banner .title {
  font-size: 38px;
  font-weight: 600;
  margin: 6px 0;
}
.calendar-card__body {
  border-radius: 0 0 28px 28px;
  background: #fff;
  padding: 26px 28px 6px;
  box-sizing: border-box;
}
.calendar-card__title {
  font-size: 27px;
  font-weight: 600;
  color: #111113;
  margin: 0 0 8px;
  line-height: 1.22;
}
.calendar-card__footer {
  text-align: center;
  color: #c3c3c8;
  font-size: 15px;
  padding: 18px 28px 26px;
}

.event-meta {
  font-size: 18px;
  color: #9a9aa0;
  margin: 0 0 14px;
}
.event-meta .alert {
  color: #c3c3c8;
  margin-left: 8px;
}
.event-subtitle {
  font-size: 19px;
  color: #1c1c1e;
  line-height: 1.4;
  margin: 0 0 12px;
}
.event-location {
  font-size: 16px;
  color: #9a9aa0;
  margin: 0 0 6px;
}

</style>
</head>
<body>
<div class="calendar-card-page">
<div class="calendar-card calendar-card--event">
  <div class="calendar-card__banner" style="background:linear-gradient(to bottom, #8E24AA 0%, #a44eba 67%, #b977ca 100%); color:#ffffff;">
    <p class="weekday">Thursday</p>
    <p class="date">October 29, 2026</p>
  </div>
  <div class="calendar-card__body">
    <h1 class="calendar-card__title">Jason Kim&#x27;s Birthday Party</h1>
    <p class="event-meta">7pm-10pm <span class="alert">(notify 10 min before)</span></p>
    <p class="event-subtitle">Celebrating Jason&#x27;s birthday with games, arcade tokens, and dinner. Come ready to have fun!</p>
    <p class="event-location">Location: Dave &amp; Buster&#x27;s Times Square, 234 W 42nd St, New York, NY 10036</p>
  </div>
  <div class="calendar-card__footer">Calendar: Birthdays</div>
</div>
</div>
</body>
</html>
